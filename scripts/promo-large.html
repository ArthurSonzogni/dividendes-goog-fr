<!doctype html>
<!-- Marquee promotional image of the Chrome Web Store, 1400 × 560, rendered by
     scripts/images.py. shot.png is a store screenshot, copied by the script. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; }
  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    background: radial-gradient(circle at 20% 10%, #5a62f0 0%, #2f37d0 45%, #1d2290 100%);
    display: flex; align-items: center; gap: 56px; padding: 0 0 0 72px; box-sizing: border-box;
  }
  .text { flex: 0 0 470px; display: flex; flex-direction: column; gap: 26px; }
  .top { display: flex; align-items: center; gap: 20px; }
  .icon { width: 76px; height: 76px; border-radius: 19px; background: #fff; display: flex; align-items: flex-end; justify-content: center; gap: 7px; padding: 0 0 16px; box-sizing: border-box; }
  .icon i { width: 12px; border-radius: 4px; background: #2f37d0; }
  h1 { margin: 0; font-size: 50px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.05; }
  p { margin: 0; font-size: 26px; line-height: 1.4; opacity: 0.92; }
  .tags { display: flex; gap: 10px; flex-wrap: wrap; }
  .tags span { font-size: 17px; font-weight: 650; padding: 7px 15px; border-radius: 999px; background: rgba(255, 255, 255, 0.16); }
  .shot { flex: 1; height: 440px; overflow: hidden; border-radius: 18px 0 0 18px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35); }
  .shot img { width: 960px; display: block; }
</style>
</head>
<body>
  <div class="text">
    <div class="top">
      <div class="icon"><i style="height: 19px"></i><i style="height: 30px"></i><i style="height: 42px"></i></div>
      <h1>Dividendes GOOG</h1>
    </div>
    <p>Vos dividendes Alphabet de Morgan Stanley at Work, prêts à déclarer.</p>
    <div class="tags"><span>2778-DIV-SD</span><span>2047 / 2042</span><span>FR · EN</span></div>
  </div>
  <div class="shot"><img src="shot.png" alt=""></div>
</body>
</html>
