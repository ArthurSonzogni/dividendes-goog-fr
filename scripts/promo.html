<!doctype html>
<!-- Small promotional tile of the Chrome Web Store, 440 × 280, rendered by
     scripts/images.py. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    background: radial-gradient(circle at 85% 15%, #5a62f0 0%, #2f37d0 45%, #1d2290 100%);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 30px 32px; box-sizing: border-box;
  }
  .top { display: flex; align-items: center; gap: 14px; }
  .icon { width: 52px; height: 52px; border-radius: 13px; background: #fff; display: flex; align-items: flex-end; justify-content: center; gap: 5px; padding: 0 0 11px; box-sizing: border-box; }
  .icon i { width: 8px; border-radius: 3px; background: #2f37d0; }
  h1 { margin: 0; font-size: 30px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.1; }
  p { margin: 0; font-size: 17px; line-height: 1.4; opacity: 0.92; }
  .tags { display: flex; gap: 8px; }
  .tags span { font-size: 13px; font-weight: 650; padding: 5px 11px; border-radius: 999px; background: rgba(255, 255, 255, 0.16); }
</style>
</head>
<body>
  <div class="top">
    <div class="icon"><i style="height: 13px"></i><i style="height: 20px"></i><i style="height: 28px"></i></div>
    <h1>Dividendes GOOG</h1>
  </div>
  <p>Vos dividendes Alphabet de Morgan Stanley at Work, prêts à déclarer.</p>
  <div class="tags"><span>2778-DIV-SD</span><span>2047 / 2042</span><span>FR · EN</span></div>
</body>
</html>
